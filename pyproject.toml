[project]
name = "bilan-immuno-twin"
version = "0.1.0"
description = "Jumeau numérique immunitaire — digital twin of the immune system"
readme = "README.md"
authors = [
    { name = "Nurtal", email = "nathan.foulquier.pro@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[project.scripts]
bilan = "bilan_immuno_twin.cli:main"

[build-system]
requires = ["uv_build>=0.11.15,<0.12.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
